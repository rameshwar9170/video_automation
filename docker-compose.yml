version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yt_auto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ytauto
      POSTGRES_PASSWORD: ytauto_secret
      POSTGRES_DB: yt_automation
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yt_auto_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ytauto.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
